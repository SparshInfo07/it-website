<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--navy:#060b1c;--blue:#315dff;--peri:#8ea2ff;--ink:#0f172a;--mut:#64748b;--line:#e6eaf2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
.abs{position:absolute}
.stage{position:absolute;inset:0;overflow:hidden}
.dark{background:radial-gradient(1100px 760px at 72% 46%,#1c3285 0%,#0c1638 42%,#060b1c 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:30px 30px;-webkit-mask-image:radial-gradient(900px 700px at 70% 50%,#000 30%,transparent 80%)}
.ldots{position:absolute;inset:0;background-image:radial-gradient(rgba(15,23,42,.08) 1.2px,transparent 1.3px);background-size:26px 26px}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.card{background:#fff;border-radius:18px;box-shadow:0 30px 70px -20px rgba(2,8,40,.45),0 2px 6px rgba(2,8,40,.08)}
.solid{background:#111b46;border:1px solid rgba(255,255,255,.12);border-radius:18px;color:#fff;box-shadow:0 24px 60px -20px rgba(0,0,0,.65)}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;backdrop-filter:blur(10px);color:#fff}
.phone{position:absolute;background:#0b1020;border-radius:46px;padding:11px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6),inset 0 0 0 2px #2a3350}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#f6f8fc;position:relative}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;background:#0b1020;border-radius:14px;z-index:3}
.browser{position:absolute;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -25px rgba(2,8,40,.55),0 2px 8px rgba(2,8,40,.1)}
.bar{height:40px;background:#f1f4f9;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
.bar i{width:11px;height:11px;border-radius:50%;background:#d6dbe6;display:block}
.bar i:nth-child(1){background:#ff6b6b}.bar i:nth-child(2){background:#ffc94d}.bar i:nth-child(3){background:#3ecf8e}
.url{margin-left:18px;flex:1;max-width:46%;height:24px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;align-items:center;padding:0 12px}
.ln{height:10px;border-radius:6px;background:#e3e8f1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-weight:700;color:#fff}
.dot{width:8px;height:8px;border-radius:50%}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
svg{display:block}
</style></head>
<body><div id="root"></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const scene = P.get("scene"), ind = P.get("ind");
const root = document.getElementById("root");
let target = root;
const h = (s) => { target.insertAdjacentHTML("beforeend", s); };

/* ---------- icons (stroke paths, 24 grid) ---------- */
const I = {

  cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/>',
  cursor:'<path d="M4 3l7 17 2.5-7.5L21 10z" fill="currentColor"/>', layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>', shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>', box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',

  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/>', wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5"/>',
  tag:'<path d="M12 2H2v10l9.3 9.3a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7" cy="7" r="1.5"/>', gauge:'<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  pen:'<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/>',
  phone:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>', send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
};
const ic = (n, s = 20, c = "currentColor", w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ---------- industry themes ---------- */
const T = {
  manufacturing:{ cv:"₹35,400", c:"#2b59ff", c2:"#7fa0ff", tint:"#eaf0ff", tint2:"#dfe7ff", brand:"FORME Industrial", icon:"box",
    h1:"Precision parts,<br>ready to quote.", items:[["Ball Valves","from ₹1,240"],["Pump Sets","from ₹18,900"],["Pipe Fittings","from ₹85"]],
    tabs:["Catalogue","Quotes","Orders"], stat:["Open quotes","24"], note:"RFQ-1042 · 30 units requested", q:"Can you quote 30 ball valves, 2 inch, stainless?", a:"Yes. I've drafted RFQ-1042: 30 × SS ball valve 2\" at ₹1,180 each. Ready for your approval.", detail:["Ball Valve 2\"","SS 316 · PN40"], kpi:"₹4.8L" },
  retail:{ cv:"₹2,490", c:"#e0663a", c2:"#f5a27f", tint:"#fff1ea", tint2:"#fde3d6", brand:"ATELIER & Co.", icon:"tag",
    h1:"The new season<br>collection.", items:[["Linen Overshirt","₹2,490"],["Knit Polo","₹1,790"],["Relaxed Chino","₹2,190"]],
    tabs:["Shop","Wishlist","Orders"], stat:["Orders today","186"], note:"Order #4821 is out for delivery", q:"Does the linen overshirt come in medium?", a:"It does! Medium is in stock in Sand and Olive. Want me to add one to your bag?", detail:["Linen Overshirt","Sand · M"], kpi:"₹2.1L" },
  healthcare:{ cv:"Tomorrow", c:"#0f9f8c", c2:"#6fd3c4", tint:"#e7f7f4", tint2:"#d3f0ea", brand:"CareFirst Clinic", icon:"heart",
    h1:"Care that fits<br>your schedule.", items:[["Cardiology","Dr. Mehta"],["Dental Care","Dr. Rao"],["Pediatrics","Dr. Iyer"]],
    tabs:["Book","Reports","Doctors"], stat:["Visits booked","42"], note:"Appointment confirmed · 10:30 AM", q:"Can I see a cardiologist tomorrow morning?", a:"Dr. Mehta has a 10:30 AM slot tomorrow. Shall I book it and send a reminder?", detail:["Dr. A. Mehta","Cardiology · 10:30"], kpi:"98%" },
  education:{ cv:"68%", c:"#7c4dff", c2:"#b9a2ff", tint:"#f2edff", tint2:"#e6dcff", brand:"BrightPath Academy", icon:"book",
    h1:"Learn at your<br>own pace.", items:[["UX Foundations","12 lessons"],["Data Basics","9 lessons"],["Public Speaking","7 lessons"]],
    tabs:["Courses","Schedule","Results"], stat:["Active learners","1,240"], note:"New lesson unlocked · Module 4", q:"When is the next admissions deadline?", a:"Applications for the July intake close on 15 June. I can send you the checklist now.", detail:["UX Foundations","Module 4 · 68%"], kpi:"68%" },
  fintech:{ cv:"+32%", c:"#1463d6", c2:"#6ea5f2", tint:"#e9f2fd", tint2:"#d8e8fb", brand:"Northstar Finance", icon:"wallet",
    h1:"Money, made<br>clear.", items:[["Savings","₹2,40,000"],["Investments","₹1,86,300"],["Credit","₹56,000"]],
    tabs:["Home","Pay","Insights"], stat:["Balance","₹4.82L"], note:"Salary credited · ₹85,000", q:"Why was my spending higher this month?", a:"Travel was 32% above your average, mostly flights on 4 May. Everything else is on track.", detail:["Total balance","₹4,82,300"], kpi:"+12%" },
};

/* ---------- mini UI building blocks ---------- */
const img = (t, h = 90, r = 12, k = 0) => `<div style="height:${h}px;border-radius:${r}px;background:linear-gradient(${135 + k * 40}deg,${t.c2},${t.c});position:relative;overflow:hidden"><div style="position:absolute;right:-18%;bottom:-40%;width:70%;height:120%;border-radius:50%;background:rgba(255,255,255,.22)"></div><div style="position:absolute;left:14%;top:22%;width:28%;height:46%;border-radius:10px;background:rgba(255,255,255,.35)"></div></div>`;
const bars = (t, n = 7, h = 70) => `<div class="row" style="align-items:flex-end;gap:7px;height:${h}px">${Array.from({ length: n }, (_, i) => `<div style="flex:1;border-radius:5px 5px 2px 2px;height:${[45, 62, 38, 74, 58, 88, 70, 52, 80][i % 9]}%;background:${i === 5 ? t.c : t.tint2}"></div>`).join("")}</div>`;

const appHome = (t, compact) => `
  <div style="padding:46px 18px 18px;height:100%;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,${t.tint} 0%,#fff 46%)">

    <div style="border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,${t.c},${t.c2})"><div style="font-size:12px;opacity:.85">${t.stat[0]}</div><div style="font-size:28px;font-weight:800;margin-top:4px">${t.stat[1]}</div><div style="margin-top:12px;height:6px;border-radius:4px;background:rgba(255,255,255,.3)"><div style="width:68%;height:100%;border-radius:4px;background:#fff"></div></div></div>
    <div class="row" style="gap:8px">${t.tabs.map((x, i) => `<span class="chip" style="padding:7px 12px;font-size:12px;${i === 0 ? `background:${t.c};color:#fff` : "background:#fff;color:#334155;box-shadow:0 1px 4px rgba(0,0,0,.06)"}">${x}</span>`).join("")}</div>
    ${t.items.slice(0, compact ? 2 : 3).map((x, i) => `<div class="row" style="gap:12px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 10px rgba(15,23,42,.05)"><div style="width:48px;flex:none">${img(t, 48, 12, i)}</div><div style="flex:1"><div style="font-size:14px;font-weight:700">${x[0]}</div><div style="font-size:12px;color:var(--mut);margin-top:2px">${x[1]}</div></div><div class="ic" style="width:30px;height:30px;border-radius:10px;background:${t.tint}">${ic("check", 14, t.c, 2.6)}</div></div>`).join("")}
    <div style="margin-top:auto" class="row"><div class="btn" style="flex:1;height:46px;border-radius:14px;background:#0f172a;font-size:14px">Continue</div></div>
  </div>`;
const appDetail = (t) => `
  <div style="height:100%;display:flex;flex-direction:column">
    <div style="height:46%;position:relative">${img(t, 9999, 0, 1).replace("height:9999px", "height:100%")}</div>
    <div style="padding:18px;display:flex;flex-direction:column;gap:10px;flex:1;background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;position:relative">
      <div style="width:40px;height:4px;border-radius:3px;background:#e2e8f0;margin:0 auto 4px"></div>
      <div style="font-size:19px;font-weight:800">${t.detail[0]}</div><div style="font-size:13px;color:var(--mut)">${t.detail[1]}</div>
      <div class="ln" style="width:92%"></div><div class="ln" style="width:76%"></div>

      <div class="btn" style="margin-top:auto;height:48px;border-radius:14px;background:${t.c};font-size:15px">${t.tabs[0] === "Book" ? "Book now" : t.tabs[0] === "Courses" ? "Resume lesson" : t.tabs[0] === "Home" ? "View details" : t.tabs[0] === "Shop" ? "Add to bag" : "Request quote"}</div>
    </div>
  </div>`;
const website = (t, big) => `
  <div style="height:100%;display:flex;flex-direction:column;background:#fff">
    <div class="row" style="justify-content:space-between;padding:${big ? "18px 34px" : "14px 24px"};border-bottom:1px solid #f0f2f7"><div class="row" style="gap:10px;font-weight:800;font-size:${big ? 17 : 15}px"><span class="ic" style="width:28px;height:28px;border-radius:8px;background:${t.c}">${ic(t.icon, 15, "#fff")}</span>${t.brand}</div><div class="row" style="gap:${big ? 26 : 18}px;font-size:13px;color:#475569">${t.tabs.map((x) => `<span>${x}</span>`).join("")}<span class="btn" style="height:32px;padding:0 14px;background:${t.c};font-size:12px">${t.tabs[0] === "Book" ? "Book visit" : "Get quote"}</span></div></div>

      <div class="row" style="gap:8px;margin-left:40px"><span class="chip" style="background:${t.c};color:#fff;font-size:12px">${ic("check", 13, "#fff", 2.6)} Approve</span><span class="chip" style="background:${dark ? "rgba(255,255,255,.1)" : "#fff"};color:${dark ? "#fff" : "#334155"};border:1px solid ${dark ? "rgba(255,255,255,.16)" : "#e2e8f0"};font-size:12px">Edit</span></div>

const wireframe = () => `<div style="padding:16px;display:flex;flex-direction:column;gap:10px;height:100%"><div class="ln" style="width:40%;height:12px;background:#cfd6e4"></div><div style="height:90px;border-radius:10px;border:2px dashed #cfd6e4;display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M2 2l36 36M38 2 2 38" stroke="#cfd6e4" stroke-width="2"/></svg></div><div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="row" style="gap:8px">${[1, 2].map(() => `<div style="flex:1;height:60px;border-radius:8px;background:#e8ecf3"></div>`).join("")}</div><div class="ln" style="width:80%"></div><div style="margin-top:auto;height:36px;border-radius:10px;background:#cfd6e4"></div></div>`;
