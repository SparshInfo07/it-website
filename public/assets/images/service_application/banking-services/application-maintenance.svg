<svg width="420" height="260" viewBox="0 0 420 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="cardGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E194A" stop-opacity="0" />
    </radialGradient>

    <!-- Main Cyan-Blue Gradients -->
    <linearGradient id="neonGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="fillGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="210" cy="130" r="120" fill="url(#cardGlow3)" />

  <!-- Floating Background Card Silhouette 1 (Left) -->
  <rect x="60" y="70" width="120" height="100" rx="12" fill="white" fill-opacity="0.03" stroke="#60A5FA" stroke-opacity="0.15" stroke-width="1.5" />
  
  <!-- Floating Background Card Silhouette 2 (Right) -->
  <rect x="240" y="50" width="130" height="110" rx="14" fill="white" fill-opacity="0.04" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Window Container -->
  <rect x="110" y="45" width="200" height="145" rx="12" fill="url(#fillGrad3)" stroke="url(#neonGrad3)" stroke-width="2" />

  <!-- Window Header Bar -->
  <line x1="110" y1="70" x2="310" y2="70" stroke="url(#neonGrad3)" stroke-opacity="0.4" stroke-width="1.5" />
  <!-- Window 3 Control Dots -->
  <circle cx="125" cy="58" r="3" fill="#67E8F9" />
  <circle cx="135" cy="58" r="3" fill="#38BDF8" />
  <circle cx="145" cy="58" r="3" fill="#60A5FA" />

  <!-- Monitoring Pulse & Health Analytics Dashboard inside window -->
  <!-- Status badge -->
  <rect x="125" y="80" width="60" height="18" rx="4" fill="url(#fillGrad3)" stroke="url(#neonGrad3)" stroke-width="1.2" />
  <circle cx="135" cy="89" r="3" fill="#4ADE80" />
  <text x="143" y="93" font-family="sans-serif" font-size="9" font-weight="600" fill="#67E8F9">99.9% UP</text>

  <!-- Metric Bar Charts -->
  <rect x="250" y="86" width="6" height="12" rx="1.5" fill="url(#neonGrad3)" fill-opacity="0.5" />
  <rect x="260" y="80" width="6" height="18" rx="1.5" fill="url(#neonGrad3)" fill-opacity="0.7" />
  <rect x="270" y="74" width="6" height="24" rx="1.5" fill="url(#neonGrad3)" />

  <!-- Realtime ECG / Heartbeat Performance Wave -->
  <path d="M125 132H150L158 116L168 148L178 122L186 138L192 132H230" stroke="url(#neonGrad3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Diagnostic Grid Floor Lines -->
  <line x1="125" y1="150" x2="230" y2="150" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
  <line x1="125" y1="160" x2="220" y2="160" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1" />

  <!-- Overlapping Maintenance Shield / Tool Hub (Bottom Right) -->
  <g transform="translate(290, 160)">
    <circle cx="0" cy="0" r="32" fill="#1E194A" fill-opacity="0.85" />
    <circle cx="0" cy="0" r="30" fill="url(#fillGrad3)" stroke="url(#neonGrad3)" stroke-width="2.5" />
    <!-- 24/7 Support Shield & Checkmark -->
    <path d="M0 -15L14 -8V3C14 11 8 16 0 19C-8 16 -14 11 -14 3V-8L0 -15Z" fill="url(#fillGrad3)" stroke="url(#neonGrad3)" stroke-width="2" stroke-linejoin="round" />
    <path d="M-5 1L-1 5L6 -3" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
