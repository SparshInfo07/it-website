<svg width="420" height="260" viewBox="0 0 420 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="cardGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E194A" stop-opacity="0" />
    </radialGradient>

    <!-- Main Cyan-Blue Gradients -->
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="fillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="gearGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="210" cy="130" r="120" fill="url(#cardGlow1)" />

  <!-- Floating Background Card Silhouette 1 (Left) -->
  <rect x="60" y="70" width="120" height="100" rx="12" fill="white" fill-opacity="0.03" stroke="#60A5FA" stroke-opacity="0.15" stroke-width="1.5" />
  
  <!-- Floating Background Card Silhouette 2 (Right) -->
  <rect x="240" y="50" width="130" height="110" rx="14" fill="white" fill-opacity="0.04" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Window Container -->
  <rect x="110" y="45" width="200" height="145" rx="12" fill="url(#fillGrad1)" stroke="url(#neonGrad1)" stroke-width="2" />

  <!-- Window Header Bar -->
  <line x1="110" y1="70" x2="310" y2="70" stroke="url(#neonGrad1)" stroke-opacity="0.4" stroke-width="1.5" />
  <!-- Window 3 Control Dots -->
  <circle cx="125" cy="58" r="3" fill="#67E8F9" />
  <circle cx="135" cy="58" r="3" fill="#38BDF8" />
  <circle cx="145" cy="58" r="3" fill="#60A5FA" />

  <!-- Bank / Financial Architecture Building inside window -->
  <!-- Triangular Roof Pediment -->
  <path d="M150 96L210 77L270 96H150Z" fill="url(#neonGrad1)" fill-opacity="0.3" stroke="url(#neonGrad1)" stroke-width="2" stroke-linejoin="round" />
  <!-- Entablature / Roof Base Beam -->
  <rect x="154" y="96" width="112" height="6" rx="2" fill="url(#neonGrad1)" fill-opacity="0.5" stroke="url(#neonGrad1)" stroke-width="1.5" />

  <!-- 4 Classical Pillars -->
  <!-- Pillar 1 -->
  <rect x="162" y="102" width="10" height="34" rx="2" fill="url(#neonGrad1)" fill-opacity="0.4" stroke="url(#neonGrad1)" stroke-width="1.5" />
  <!-- Pillar 2 -->
  <rect x="187" y="102" width="10" height="34" rx="2" fill="url(#neonGrad1)" fill-opacity="0.4" stroke="url(#neonGrad1)" stroke-width="1.5" />
  <!-- Pillar 3 -->
  <rect x="213" y="102" width="10" height="34" rx="2" fill="url(#neonGrad1)" fill-opacity="0.4" stroke="url(#neonGrad1)" stroke-width="1.5" />
  <!-- Pillar 4 -->
  <rect x="238" y="102" width="10" height="34" rx="2" fill="url(#neonGrad1)" fill-opacity="0.4" stroke="url(#neonGrad1)" stroke-width="1.5" />

  <!-- Building Base Steps -->
  <rect x="152" y="136" width="116" height="5" rx="1.5" fill="url(#neonGrad1)" fill-opacity="0.5" stroke="url(#neonGrad1)" stroke-width="1.5" />
  <rect x="146" y="141" width="128" height="6" rx="2" fill="url(#neonGrad1)" fill-opacity="0.6" stroke="url(#neonGrad1)" stroke-width="1.5" />

  <!-- Overlapping Gear Icon (Bottom Right of window) -->
  <g transform="translate(290, 160)">
    <!-- Gear drop blur / halo -->
    <circle cx="0" cy="0" r="32" fill="#1E194A" fill-opacity="0.8" />
    <circle cx="0" cy="0" r="30" fill="url(#fillGrad1)" stroke="url(#gearGrad1)" stroke-width="2.5" />
    <!-- Gear Teeth -->
    <path d="M-5 -29H5V-23H-5V-29Z" fill="url(#gearGrad1)" />
    <path d="M-5 23H5V29H-5V23Z" fill="url(#gearGrad1)" />
    <path d="M-29 -5V5H-23V-5H-29Z" fill="url(#gearGrad1)" />
    <path d="M23 -5V5H29V-5H23Z" fill="url(#gearGrad1)" />
    <path d="M-21 -21L-13 -13L-17 -9L-25 -17L-21 -21Z" fill="url(#gearGrad1)" />
    <path d="M13 13L21 21L17 25L9 17L13 13Z" fill="url(#gearGrad1)" />
    <path d="M-21 21L-13 13L-9 17L-17 25L-21 21Z" fill="url(#gearGrad1)" />
    <path d="M13 -13L21 -21L25 -17L17 -9L13 -13Z" fill="url(#gearGrad1)" />
    <!-- Gear Center Hole -->
    <circle cx="0" cy="0" r="12" fill="#131B4D" stroke="url(#gearGrad1)" stroke-width="2" />
  </g>
</svg>
