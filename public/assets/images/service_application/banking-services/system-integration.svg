<svg width="420" height="260" viewBox="0 0 420 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="cardGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E194A" stop-opacity="0" />
    </radialGradient>

    <!-- Main Cyan-Blue Gradients -->
    <linearGradient id="neonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="fillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="210" cy="130" r="120" fill="url(#cardGlow2)" />

  <!-- Floating Background Card Silhouette 1 (Left) -->
  <rect x="60" y="70" width="120" height="100" rx="12" fill="white" fill-opacity="0.03" stroke="#60A5FA" stroke-opacity="0.15" stroke-width="1.5" />
  
  <!-- Floating Background Card Silhouette 2 (Right) -->
  <rect x="240" y="50" width="130" height="110" rx="14" fill="white" fill-opacity="0.04" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Window Container -->
  <rect x="110" y="45" width="200" height="145" rx="12" fill="url(#fillGrad2)" stroke="url(#neonGrad2)" stroke-width="2" />

  <!-- Window Header Bar -->
  <line x1="110" y1="70" x2="310" y2="70" stroke="url(#neonGrad2)" stroke-opacity="0.4" stroke-width="1.5" />
  <!-- Window 3 Control Dots -->
  <circle cx="125" cy="58" r="3" fill="#67E8F9" />
  <circle cx="135" cy="58" r="3" fill="#38BDF8" />
  <circle cx="145" cy="58" r="3" fill="#60A5FA" />

  <!-- System Integration Nodes & Data Pipelines inside window -->
  <!-- Center Core Hub Node -->
  <rect x="185" y="100" width="50" height="36" rx="6" fill="url(#fillGrad2)" stroke="url(#neonGrad2)" stroke-width="2" />
  <text x="210" y="122" font-family="sans-serif" font-size="10" font-weight="bold" fill="#67E8F9" text-anchor="middle">API</text>

  <!-- Left Connected Node -->
  <circle cx="142" cy="118" r="14" fill="url(#fillGrad2)" stroke="url(#neonGrad2)" stroke-width="1.8" />
  <path d="M136 118H148M142 112V124" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />

  <!-- Connecting Lines with Pulse Dots -->
  <line x1="156" y1="118" x2="185" y2="118" stroke="url(#neonGrad2)" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="235" y1="118" x2="264" y2="118" stroke="url(#neonGrad2)" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Right Connected Node -->
  <circle cx="278" cy="118" r="14" fill="url(#fillGrad2)" stroke="url(#neonGrad2)" stroke-width="1.8" />
  <rect x="273" y="113" width="10" height="10" rx="2" stroke="#38BDF8" stroke-width="1.6" />

  <!-- Top Cloud Node -->
  <path d="M192 88C192 84 196 82 200 82C203 78 210 78 214 81C218 79 224 81 226 85C229 86 230 89 228 92H194C192 91 192 89 192 88Z" fill="url(#neonGrad2)" fill-opacity="0.4" stroke="url(#neonGrad2)" stroke-width="1.5" />
  <line x1="210" y1="92" x2="210" y2="100" stroke="url(#neonGrad2)" stroke-width="1.8" />

  <!-- Overlapping Sync Arrows Hub (Bottom Right) -->
  <g transform="translate(290, 160)">
    <circle cx="0" cy="0" r="32" fill="#1E194A" fill-opacity="0.85" />
    <circle cx="0" cy="0" r="30" fill="url(#fillGrad2)" stroke="url(#neonGrad2)" stroke-width="2.5" />
    <!-- Bidirectional Circular Sync Arrows -->
    <path d="M-14 -4A16 16 0 0 1 14 -4" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M10 -9L15 -4L10 1" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M14 4A16 16 0 0 1 -14 4" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M-10 9L-15 4L-10 -1" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
